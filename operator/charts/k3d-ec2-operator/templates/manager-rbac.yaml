apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k3d-ec2-operator.fullname" . }}-manager-role
  labels:
  {{- include "k3d-ec2-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - compute.domain.com
  resources:
  - ec2instances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.domain.com
  resources:
  - ec2instances/finalizers
  verbs:
  - update
- apiGroups:
  - compute.domain.com
  resources:
  - ec2instances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k3d-ec2-operator.fullname" . }}-manager-rolebinding
  labels:
  {{- include "k3d-ec2-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "k3d-ec2-operator.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "k3d-ec2-operator.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'