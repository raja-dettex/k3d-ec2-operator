apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k3d-ec2-operator.fullname" . }}-ec2instance-editor-role
  labels:
  {{- include "k3d-ec2-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - compute.domain.com
  resources:
  - ec2instances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.domain.com
  resources:
  - ec2instances/status
  verbs:
  - get